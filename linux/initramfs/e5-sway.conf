# sway on the e5 (`wayland sway`): 320x240, software drawing (pixman),
# keyboard only. `wayland` copies this to $XDG_RUNTIME_DIR/sway.conf and
# swaps the marker line below for render_bit_depth 6 on a 16 bpp kernel
# (e5_display.rgb565=1). installed as /etc/xdg/e5/sway.conf: alpine's sway
# owns /etc/sway/config.
# mod = Ctrl: the right soft key is Ctrl for one key (press it, then the key)
set $mod Control
font pango:DejaVu Sans Mono 7
default_border pixel 1
default_floating_border pixel 1
titlebar_padding 1
hide_edge_borders smart
focus_follows_mouse no
xwayland disable
#@DEPTH@
input type:keyboard {
	xkb_layout e5
	repeat_delay 500
	repeat_rate 20
}
bindsym $mod+Return exec foot
bindsym $mod+q kill
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+e layout toggle split
bindsym $mod+s layout stacking
bindsym $mod+t layout tabbed
bindsym $mod+f fullscreen toggle
bindsym $mod+period workspace next
bindsym $mod+comma workspace prev
# back to the console
bindsym $mod+x exit
bar {
	position top
	font pango:DejaVu Sans Mono 7
	height 12
	status_command while :; do echo "$(cat /sys/class/power_supply/*/capacity 2>/dev/null | head -1)%  $(date +%H:%M)"; sleep 30; done
	colors {
		background #202833
		statusline #c0c8d0
	}
}
exec foot
exec foot
