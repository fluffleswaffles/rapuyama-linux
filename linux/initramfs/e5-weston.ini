# weston on the e5: drm backend + pixman (no gpu), 320x240, keyboard only.
# adapted from the e6's weston.ini; `wayland` (e5-wayland.sh) copies this to
# $XDG_RUNTIME_DIR/weston.ini and fills in the marker line below.
# the panel is slow over the display bus, so every animation is off and the
# terminal comes up right away

[core]
backend=drm
renderer=pixman
# e5_display.rgb565=Y: pixman draws 565 itself (`wayland` swaps the marker
# line for the 565 format setting only then; otherwise XRGB8888)
#@GBM@
# the dumb buffers are cached shmem: draw straight into them, no extra copy
pixman-shadow=false
idle-time=0
# the keypad is not a libinput keyboard until the driver is up: start anyway
require-input=false

[shell]
background-color=0xff202833
# 240 lines are too few for a panel: the terminal gets the whole screen
panel-position=none
locking=false
close-animation=none
startup-animation=none
focus-animation=none

[autolaunch]
path=/usr/bin/foot

[keyboard]
# e5 = the printed layout (/etc/xkb/symbols/e5, tools/e5-xkb.py): sym =
# the printed symbols, fn = the Fn layer, both for one key
keymap_layout=e5
repeat-rate=20
repeat-delay=500
