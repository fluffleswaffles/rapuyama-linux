# E5-00: minimal X on the rapuyama-e5 KMS device (modesetting driver),
# keypad via evdev.
# Installed as /etc/X11/xorg.conf.d/10-e5.conf (tools/sdroot.sh e5); X itself
# is optional: apk add xorg-server xf86-input-evdev xinit
# font-misc-misc. Started by `browser` (e5-browser.sh).
# No udev on the phone: no hotplug, every device is listed here.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# no GPU on the E5 (the DRM device is dumb scanout only): OpenGL and video
# overlays can't work (glx off: Xorg rss 42 -> 8 MB). DRI2/DRI3 are built
# in, can't be disabled by name, and are idle
Section "Module"
	Disable "glx"
EndSection

Section "Extensions"
	Option "GLX" "Disable"
	Option "XVideo" "Disable"
	Option "XVideo-MotionCompensation" "Disable"
	Option "XFree86-DGA" "Disable"
EndSection

Section "Device"
	Identifier "e5kms"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "ShadowFB" "true"
	# no GPU: no glamor (it would load and probe mesa/EGL at every start)
	Option "AccelMethod" "none"
EndSection

Section "Screen"
	Identifier "e5screen"
	Device "e5kms"
	# depth is not set here: `browser` passes -depth (16 when the kernel is rgb565)
EndSection

# "Nokia E5 keyboard" (rapuyama-e5-keypad) is the only input device
Section "InputDevice"
	Identifier "e5keypad"
	Driver "evdev"
	# symlink made by `browser` (e5-browser.sh): the event number varies
	Option "Device" "/dev/input/e5-keypad"
	# off: e5-keyd reads the keypad too (fn key picture, power key); X
	# switches its vt keyboard off, so the console gets nothing
	Option "GrabDevice" "off"
	Option "XkbLayout" "us"
EndSection

Section "ServerLayout"
	Identifier "e5"
	Screen "e5screen"
	InputDevice "e5keypad" "CoreKeyboard"
EndSection
