# E5-00: minimal X on the rapuyama-e5 fbdev (DMA push), keypad via evdev.
# Installed as /etc/X11/xorg.conf.d/10-e5.conf (tools/sdroot.sh e5); X itself
# is optional: apk add xorg-server xf86-video-fbdev xf86-input-evdev xinit
# font-misc-misc. Started by `browser` (e5-browser.sh).
# No udev on the phone: no hotplug, every device is listed here.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# no GPU and no DRM on the E5: OpenGL and video overlays can't work (glx
# off: Xorg rss 42 -> 8 MB). DRI2/DRI3 are built in, can't be disabled by
# name, and are idle without a DRM device
Section "Module"
	Disable "glx"
EndSection

Section "Extensions"
	Option "GLX" "Disable"
	Option "XVideo" "Disable"
	Option "XVideo-MotionCompensation" "Disable"
	Option "XFree86-DGA" "Disable"
EndSection

Section "Device"
	Identifier "e5fb"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
	Identifier "e5screen"
	Device "e5fb"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
	EndSubSection
EndSection

# "Nokia E5 keyboard" (rapuyama-e5-keypad) is the only input device
Section "InputDevice"
	Identifier "e5keypad"
	Driver "evdev"
	Option "Device" "/dev/input/event0"
	Option "GrabDevice" "on"
	Option "XkbLayout" "us"
EndSection

Section "ServerLayout"
	Identifier "e5"
	Screen "e5screen"
	InputDevice "e5keypad" "CoreKeyboard"
EndSection
